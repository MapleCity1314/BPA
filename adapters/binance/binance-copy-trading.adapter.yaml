apiVersion: bpa.adapter/v1alpha1
kind: Adapter
metadata:
  id: binance-copy-trading
  version: 1.4.0
  title: Binance 合约跟单只读采集 Adapter
  description: 从用户已登录的 Binance 合约跟单管理页读取账户汇总、项目摘要和当前可见仓位；不读取认证存储，不执行交易或设置操作。
platform: binance
origins: [https://www.binance.com]
extension: { minimumVersion: 0.6.2 }
capabilities:
  - nodeId: binance.copy-trading.management.snapshot.read
    nodeVersions: [1.4.0]
    handlerId: binance.copy-trading.management.snapshot.read
    handlerVersion: 1.4.0
    implementationDigest: sha256:e4512e0f19b102788811b4c2ce1a48e2fdae958b9ae58a5dfa183ebf9f8ffe54
    permissions: [browser.dom.read, browser.dom.write, browser.tabs.read]
  - nodeId: binance.copy-trading.project.detail.collect
    nodeVersions: [1.4.0]
    handlerId: binance.copy-trading.project.detail.collect
    handlerVersion: 1.4.0
    implementationDigest: sha256:e4512e0f19b102788811b4c2ce1a48e2fdae958b9ae58a5dfa183ebf9f8ffe54
    permissions: [browser.dom.read, browser.dom.write, browser.tabs.read]
