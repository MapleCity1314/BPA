apiVersion: bpa.adapter/v1alpha1
kind: Adapter
metadata:
  id: doudian-inventory
  version: 2.0.0
  title: 抖店库存页面 Adapter
  description: 在同一受管商品页中精确切换店铺，并只读采集 SKU、占用、未占用及渠道库存；不提交平台库存修改。
platform: doudian
origins:
  - https://fxg.jinritemai.com
extension:
  minimumVersion: 0.6.2
capabilities:
  - nodeId: doudian.inventory.shop.activate
    nodeVersions: [1.0.0]
    handlerId: doudian.inventory.shop.activate
    handlerVersion: 1.0.0
    implementationDigest: sha256:c8d1d1b04a1c4b8d502c221e0ac4d877af6281f22237d220e82f5b7371f752a6
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
  - nodeId: doudian.inventory.product.snapshot.read
    nodeVersions:
      - 2.0.0
    handlerId: doudian.inventory.product.snapshot.read
    handlerVersion: 2.0.0
    implementationDigest: sha256:c8d1d1b04a1c4b8d502c221e0ac4d877af6281f22237d220e82f5b7371f752a6
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
