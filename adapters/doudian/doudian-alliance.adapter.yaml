apiVersion: bpa.adapter/v1alpha1
kind: Adapter
metadata:
  id: doudian-alliance
  version: 1.0.0
  title: 抖店精选联盟已清退商品巡检 Adapter
  description: 固定从抖店登录上下文进入精选联盟、逐店切换、关闭已知广告弹窗和只读采集清退商品的跨域实现。
platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.0
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 1.0.0
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 1.0.0
    implementationDigest: sha256:9c79fc1c5bb0401ef48e2554bb510e57da863fb91f3b3a14f67addcdd26a1a0b
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
  - nodeId: doudian.alliance.shop.retired-products.scan
    nodeVersions:
      - 1.0.0
    handlerId: doudian.alliance.shop.retired-products.scan
    handlerVersion: 1.0.0
    implementationDigest: sha256:9c79fc1c5bb0401ef48e2554bb510e57da863fb91f3b3a14f67addcdd26a1a0b
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
  - nodeId: doudian.alliance.retired-products.aggregate
    nodeVersions:
      - 1.0.0
    handlerId: doudian.alliance.retired-products.aggregate
    handlerVersion: 1.0.0
    implementationDigest: sha256:9c79fc1c5bb0401ef48e2554bb510e57da863fb91f3b3a14f67addcdd26a1a0b
    permissions:
      - browser.dom.read
      - browser.tabs.read
