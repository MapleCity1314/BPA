apiVersion: bpa.adapter/v1alpha1
kind: Adapter
metadata:
  id: doudian-alliance
  version: 2.0.0
  title: 抖店精选联盟已清退商品巡检 Adapter
  description: 固定从抖店登录上下文进入精选联盟、逐店切换、关闭已知广告弹窗和只读采集清退商品的跨域实现。
platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.2
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.0
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.0
    implementationDigest: sha256:e72d57b49d5ef0f4e068c4d273e2637211f76c1d01b91fb2afef6434db01b4e2
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
  - nodeId: doudian.alliance.shop.retired-products.scan
    nodeVersions:
      - 2.0.0
    handlerId: doudian.alliance.shop.retired-products.scan
    handlerVersion: 2.0.0
    implementationDigest: sha256:e72d57b49d5ef0f4e068c4d273e2637211f76c1d01b91fb2afef6434db01b4e2
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
