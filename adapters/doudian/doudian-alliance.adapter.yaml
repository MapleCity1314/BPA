platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.6
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.13
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.13
    implementationDigest: sha256:80b06779d212f315c3a4bf48ff5b2f026c69c128a939dbd9948157b6e2b50618
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
