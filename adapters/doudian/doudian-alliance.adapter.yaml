platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.7
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.14
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.14
    implementationDigest: sha256:76590a4ac654face27ca7ed74d94b518d9f3f2cae6b7725c9536b8f4ed6548c1
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
