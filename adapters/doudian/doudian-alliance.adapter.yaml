  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.9
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.16
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.16
    implementationDigest: sha256:9bfd7a3b14d2b1272388039e7de1574c362790979365c155b1f2ae7e9f54705e
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
