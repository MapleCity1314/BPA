platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.6
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.6
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.6
    implementationDigest: sha256:8bf0c91365fb9a7aaa1c2ecc15e87f7b1f46b14331064b1b2c39b673d7b8ed3d
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
