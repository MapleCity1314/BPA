platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.6
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.8
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.8
    implementationDigest: sha256:17906559c1c2ad68e6cf020e83ece216411fd53ff5584bbc43f3db98078dcc40
