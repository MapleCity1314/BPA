  version: 2.0.20
  title: 抖店精选联盟已清退商品巡检 Adapter
  description: 固定从抖店登录上下文进入精选联盟、逐店切换、关闭已知广告弹窗和只读采集清退商品的跨域实现。
platform: doudian
origins:
  - https://fxg.jinritemai.com
  - https://buyin.jinritemai.com
extension:
  minimumVersion: 0.6.10
capabilities:
  - nodeId: doudian.alliance.shops.discover
    nodeVersions:
      - 2.0.20
    handlerId: doudian.alliance.shops.discover
    handlerVersion: 2.0.20
    implementationDigest: sha256:ca31db6974a245582bc758cdfc39bf9dafb310c89558cebe71ef47bb8502052f
    permissions:
      - browser.dom.read
      - browser.dom.write
      - browser.tabs.read
      - browser.tabs.navigate
  - nodeId: doudian.alliance.shop.retired-products.scan
