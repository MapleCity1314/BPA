apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: ecommerce.evidence.evaluate
  version: 1.0.0
  title: 评估电商爆款证据
  description: 在保留销量区间的前提下生成 E1/E2 证据声明，识别统一观察窗口中的强表现样本和六十天内新品；不输出因果结论。
runtime: engine_team
inputSchema:
  type: object
  additionalProperties: false
  required:
    - observedAt
    - comparablePool
    - products
  properties:
    observedAt:
      type: string
      format: date
    comparablePool:
      type: object
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            type: object
    products:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - productId
          - title
          - platformCategory
          - firstListedAt
          - metrics
          - attributes
          - comparisonSignals
          - assets
        properties:
          productId:
            type: string
          title:
            type: string
          brand:
            type: string
          platformCategory:
            type: string
          firstListedAt:
            type: string
            format: date
          metrics:
            type: object
            required:
              - sales
              - salesAmountCny
            properties:
              sales:
                type: string
              salesAmountCny:
                type: string
              views:
                type:
                  - integer
                  - "null"
              conversionRate:
                type:
                  - string
                  - "null"
          attributes:
            type: array
            items:
              type: string
          comparisonSignals:
            type: object
            required:
              - productForm
              - readyToEat
              - individualPack
              - functions
              - scenes
            properties:
              productForm:
                type: string
              readyToEat:
                type: boolean
              individualPack:
                type: boolean
              unitWeightG:
                type: number
              functions:
                type: array
                items:
                  type: string
              scenes:
                type: array
                items:
                  type: string
          assets:
            type: object
            required:
              - source
              - carouselCount
              - detailSliceCount
              - sourceManifest
              - selectedMain
            properties:
              source:
                type: string
              carouselCount:
                type: integer
              detailSliceCount:
                type: integer
              sourceManifest:
                type: string
              selectedMain:
                type: object
outputSchema:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - observedAt
    - levels
    - claims
    - notEstablished
  properties:
    schemaVersion:
      const: evidence-claims/v0.2
    observedAt:
      type: string
      format: date
    levels:
      type: object
      additionalProperties: false
      required:
        - E1
        - E2
        - E3
        - E4
      properties:
        E1:
          type: string
        E2:
          type: string
        E3:
          type: string
        E4:
          type: string
    claims:
      type: array
      minItems: 4
      maxItems: 4
      items:
        type: object
    notEstablished:
      type: array
      items:
        type: string
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 10s
  idempotency: pure
  cancellable: true
errors:
  - TEAM_HANDLER_INPUT_INVALID
  - TEAM_HANDLER_RESULT_LIMIT_EXCEEDED
  - TEAM_HANDLER_CANCELLED
  - TEAM_HANDLER_TIMEOUT
