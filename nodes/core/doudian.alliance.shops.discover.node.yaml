apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.alliance.shops.discover
  version: 2.0.3
  title: 发现抖店联盟店铺
  description: 从已绑定的抖店商品管理标签页读取完整可切换店铺列表；经营中店铺必须具有稳定数字 ID，才能进入逐店事实链路。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [maxShops]
  properties:
    maxShops: { type: integer, minimum: 1, maximum: 100 }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, shops, sourceShop, discoveredCount, collectableCount, observedAt, diagnostics]
  properties:
    status: { const: complete }
    shops:
      type: array
      minItems: 1
      maxItems: 100
      items: { $ref: "#/$defs/shop" }
    sourceShop: { $ref: "#/$defs/shop" }
    discoveredCount: { type: integer, minimum: 1, maximum: 100 }
    collectableCount: { type: integer, minimum: 0, maximum: 100 }
    observedAt: { type: string, format: date-time }
    diagnostics:
      type: array
      maxItems: 100
      items: { type: string, maxLength: 500 }
  $defs:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      allOf:
        - if:
            properties: { status: { const: active } }
            required: [status]
          then:
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]{5,30}$" }
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, minLength: 1, maxLength: 200 }
risk:
  level: R2
  permissions: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 从已认证抖店页面完整枚举当前账号可切换店铺
execution:
  timeoutDefault: 5m
  idempotency: repeatable_read
  retryableErrors: [PAGE_LOADING, BROWSER_DISCONNECTED]
  cancellable: true
errors:
  - ALLIANCE_CONTENT_RESPONSE_TIMEOUT
  - AUTH_REQUIRED
  - BROWSER_DISCONNECTED
  - CAPTCHA_REQUIRED
  - COMMAND_RESULT_TOO_LARGE
  - COMMAND_CANCELLED
  - CURRENT_SHOP_NOT_IN_LIST
  - DEADLINE_EXCEEDED
  - DOUDIAN_ALLIANCE_DISCOVERY_FAILED
  - DOUDIAN_ALLIANCE_MAX_SHOPS_INVALID
  - PAGE_LOADING
  - PAGE_MISMATCH
  - PAGE_URL_INVALID
  - RISK_CONTROL
  - SESSION_EXPIRED
  - SHOP_CONTEXT_RESTORE_FAILED
  - SHOP_IDENTITY_DRIFT
  - SHOP_IDENTITY_AMBIGUOUS
  - SHOP_IDENTITY_UNCERTAIN
  - SHOP_IDENTITY_UNCONFIRMED
  - SHOP_LIMIT_EXCEEDED
  - SHOP_LIST_EMPTY
  - SHOP_LIST_INCOMPLETE
  - SHOP_LIST_DUPLICATED
  - SHOP_NOT_ACTIVE
  - SHOP_SWITCH_DIALOG_AMBIGUOUS
  - SHOP_SWITCH_DIALOG_CLOSE_AMBIGUOUS
  - SHOP_SWITCH_DIALOG_TIMEOUT
  - SHOP_SWITCH_NOT_CONFIRMED
  - SHOP_SWITCH_SEARCH_AMBIGUOUS
  - SHOP_SWITCH_TRIGGER_AMBIGUOUS
  - SHOP_TARGET_AMBIGUOUS
  - SHOP_TARGET_INVALID
  - SHOP_TARGET_TIMEOUT
evidence: { required: [result, error] }
adapter: { id: doudian-alliance, versions: [2.0.3] }
