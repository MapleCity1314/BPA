apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.alliance.shop.retired-products.scan
  version: 1.0.0
  title: 单店采集精选联盟已清退商品
  description: 切换到一个明确店铺，从抖店入口进入精选联盟，采集清退商品后恢复源店铺。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [shop, sourceShop]
  properties:
    shop: { $ref: "#/$defs/shop" }
    sourceShop: { $ref: "#/$defs/shop" }
  $defs:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, maxLength: 200 }
outputSchema:
  type: object
  additionalProperties: false
  required: [shop, status, retiredCount, products]
  properties:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, maxLength: 200 }
    status: { enum: [complete, skipped] }
    retiredCount: { type: integer, minimum: 0, maximum: 500 }
    updatedAt: { type: string, maxLength: 100 }
    products:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [treatmentId, title, status, processedAt, reason]
        properties:
          treatmentId: { type: string, minLength: 1, maxLength: 100 }
          productId: { type: string, pattern: "^[0-9]{5,30}$" }
          title: { type: string, minLength: 1, maxLength: 500 }
          status: { type: string, maxLength: 100 }
          processedAt: { type: string, maxLength: 100 }
          reason: { type: string, maxLength: 1000 }
    error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, maxLength: 1000 }
risk:
  level: R2
  permissions: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
  domains: [https://fxg.jinritemai.com, https://buyin.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
    allowedOrigins: [https://fxg.jinritemai.com, https://buyin.jinritemai.com]
    authentication: authenticated
    purpose: 对一个已枚举店铺完成可恢复的联盟清退商品只读采集
execution:
  timeoutDefault: 5m
  idempotency: repeatable_read
  retryableErrors: [PAGE_LOADING, BROWSER_DISCONNECTED, ALLIANCE_TAB_TIMEOUT]
  cancellable: true
  timingPolicy:
    rateLimit:
      scope: authentication_context
      minIntervalMs: 1000
      maxQueueMs: 10000
errors:
  - AUTH_REQUIRED
  - CAPTCHA_REQUIRED
  - RISK_CONTROL
  - SESSION_EXPIRED
  - PAGE_CONTEXT_CHANGED
  - PAGE_MISMATCH
  - PAGE_URL_INVALID
  - ALLIANCE_STAGE_FAILED
  - ALLIANCE_SOURCE_TAB_MISSING
  - ALLIANCE_TAB_TIMEOUT
  - PROMOTION_TAB_MISSING
  - RETIRED_TAB_MISSING
  - RETIRED_PRODUCTS_MISSING
  - RETIRED_PRODUCTS_PAGE_LOADING
  - RETIRED_PRODUCTS_PAGE_LIMIT_EXCEEDED
  - RETIRED_PRODUCTS_TABLE_CHANGED
  - RETIRED_PRODUCT_LIMIT_EXCEEDED
  - RETIRED_PRODUCT_ROW_CHANGED
  - SHOP_TARGET_INVALID
  - SHOP_TARGET_TIMEOUT
  - SHOP_SWITCH_DIALOG_TIMEOUT
  - SHOP_SWITCH_NOT_CONFIRMED
  - SHOP_IDENTITY_AMBIGUOUS
  - SHOP_IDENTITY_MISMATCH
  - SHOP_CONTEXT_RESTORE_FAILED
  - PROMOTION_DIALOG_UNRECOGNIZED
  - PROMOTION_DIALOG_CLOSE_AMBIGUOUS
  - DEADLINE_EXCEEDED
  - COMMAND_CANCELLED
evidence: { required: [result, error] }
adapter: { id: doudian-alliance, versions: [1.0.0] }
