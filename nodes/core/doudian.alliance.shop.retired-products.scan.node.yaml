apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.alliance.shop.retired-products.scan
  version: 2.0.8
  title: 单店采集精选联盟已清退商品
  description: 切换到一个具有稳定身份的经营中店铺，从抖店入口进入精选联盟，只读采集清退商品并恢复源店铺。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [shop, sourceShop]
  properties:
    shop: { $ref: "#/$defs/shop" }
    sourceShop: { $ref: "#/$defs/shop" }
  $defs:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      allOf:
        - if:
            properties: { status: { const: active } }
            required: [status]
          then:
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]{5,30}$" }
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, minLength: 1, maxLength: 200 }
outputSchema:
  type: object
  additionalProperties: false
  required: [shop, status, retiredCount, products, diagnostics]
  allOf:
    - if:
        properties: { status: { const: complete } }
        required: [status]
      then:
        required: [observedAt, updatedAt, evidence]
        properties:
          updatedAt: { type: [string, "null"], maxLength: 100 }
          observedAt: { type: string, format: date-time }
          evidence:
            type: object
            additionalProperties: false
            required: [pageUrl, capturedAt]
            properties:
              pageUrl: { type: string, format: uri, maxLength: 1000 }
              capturedAt: { type: string, format: date-time }
      else:
        properties:
          retiredCount: { const: 0 }
          products: { type: array, maxItems: 0 }
  properties:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      allOf:
        - if:
            properties: { status: { const: active } }
            required: [status]
          then:
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]{5,30}$" }
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, minLength: 1, maxLength: 200 }
    status: { enum: [complete, skipped] }
    retiredCount: { type: integer, minimum: 0, maximum: 50 }
    updatedAt: { type: [string, "null"], maxLength: 100 }
    observedAt: { type: string, format: date-time }
    products:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [treatmentId, title, status, processedAt, reason]
        properties:
          treatmentId: { type: string, minLength: 1, maxLength: 100 }
          productId: { type: string, pattern: "^[0-9]{5,30}$" }
          title: { type: string, minLength: 1, maxLength: 500 }
          status: { type: string, minLength: 1, maxLength: 100 }
          processedAt: { type: string, minLength: 1, maxLength: 100 }
          reason: { type: string, maxLength: 1000 }
    evidence:
      type: object
      additionalProperties: false
      required: [pageUrl, capturedAt]
      properties:
        pageUrl: { type: string, format: uri, maxLength: 1000 }
        capturedAt: { type: string, format: date-time }
    diagnostics:
      type: array
      maxItems: 100
      items: { type: string, maxLength: 500 }
risk:
  level: R2
  permissions: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
  domains: [https://fxg.jinritemai.com, https://buyin.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
    allowedOrigins: [https://fxg.jinritemai.com, https://buyin.jinritemai.com]
    authentication: authenticated
    purpose: 对一个已枚举店铺完成可恢复的联盟清退商品只读采集
execution:
  timeoutDefault: 5m
  idempotency: repeatable_read
  retryableErrors: [PAGE_LOADING, BROWSER_DISCONNECTED, ALLIANCE_TAB_TIMEOUT]
  cancellable: true
  timingPolicy:
    rateLimit:
      scope: authentication_context
      minIntervalMs: 1000
      maxQueueMs: 10000
errors:
  - ALLIANCE_CONTENT_RESPONSE_TIMEOUT
  - ALLIANCE_SOURCE_TAB_MISSING
  - ALLIANCE_STAGE_FAILED
  - ALLIANCE_TAB_TIMEOUT
  - AUTH_REQUIRED
  - BROWSER_DISCONNECTED
  - BROWSER_TAB_CAPACITY_EXCEEDED
  - CAPTCHA_REQUIRED
  - COMMAND_RESULT_TOO_LARGE
  - COMMAND_CANCELLED
  - DEADLINE_EXCEEDED
  - PAGE_LOADING
  - PAGE_MISMATCH
  - PAGE_URL_INVALID
  - PROMOTION_DIALOG_CLOSE_AMBIGUOUS
  - PROMOTION_DIALOG_UNRECOGNIZED
  - PROMOTION_TAB_MISSING
  - RETIRED_PRODUCT_LIMIT_EXCEEDED
  - RETIRED_PRODUCT_ROW_CHANGED
  - RETIRED_PRODUCTS_MISSING
  - RETIRED_PRODUCTS_PAGE_LIMIT_EXCEEDED
  - RETIRED_PRODUCTS_TABLE_CHANGED
  - RETIRED_TAB_MISSING
  - RISK_CONTROL
  - SESSION_EXPIRED
  - SHOP_CONTEXT_RESTORE_FAILED
  - SHOP_IDENTITY_MISMATCH
  - SHOP_IDENTITY_UNCERTAIN
  - SHOP_SWITCH_NOT_CONFIRMED
  - SHOP_TARGET_INVALID
evidence: { required: [result, error] }
adapter: { id: doudian-alliance, versions: [2.0.8] }
