apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.shop.context.read
  version: 1.3.0
  title: 读取当前抖店店铺上下文
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
outputSchema:
  type: object
  additionalProperties: false
  required:
    - supported
    - shop
    - tab_ref
    - page_epoch
  properties:
    supported:
      type: boolean
      const: true
    shop:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - identity_confirmed
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        identity_confirmed:
          type: boolean
    url:
      type: string
      format: uri
    tab_ref:
      type: object
      additionalProperties: false
      required:
        - browser_instance_id
        - tab_id
        - window_id
        - origin
      properties:
        browser_instance_id:
          type: string
          minLength: 1
        tab_id:
          type: integer
        window_id:
          type: integer
        origin:
          type: string
          format: uri
    page_epoch:
      type: string
      minLength: 1
risk:
  level: R0
  permissions:
    - browser.dom.read
    - browser.tabs.read
  domains:
    - https://fxg.jinritemai.com
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.tabs.read]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 读取冻结标签页上的当前抖店认证上下文
execution:
  timeoutDefault: 15s
  idempotency: repeatable_read
  retryableErrors:
    - PAGE_LOADING
    - BROWSER_DISCONNECTED
  cancellable: true
  timingPolicy:
    readiness:
      timeoutMs: 8000
      stableForMs: 300
      pollIntervalMs: 200
    dispatchJitter:
      minMs: 100
      maxMs: 500
      distribution: uniform
    retryBackoff:
      strategy: exponential
      baseMs: 1000
      maxMs: 5000
      jitterRatio: 0.2
    rateLimit:
      scope: tab
      minIntervalMs: 350
      maxQueueMs: 3000
errors:
  - PAGE_MISMATCH
  - PAGE_LOADING
  - BROWSER_DISCONNECTED
  - CAPTCHA_REQUIRED
  - RATE_LIMITED
  - RISK_CONTROL
  - SESSION_EXPIRED
  - PAGE_CONTEXT_CHANGED
adapter:
  id: doudian
  versions:
    - 1.2.0
