apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: packaging.master.match.batch
  version: 1.1.0
  title: 批量匹配包装主数据
  description: 使用固定版本包装匹配器批量产生确定性匹配、歧义和未匹配结果；匹配结果不代表商品问题。
runtime: engine_team
inputSchema:
  type: object
  additionalProperties: false
  required:
    - products
    - records
  properties:
    products:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
          - shopId
          - productId
          - title
          - editorUrl
        properties:
          shopId:
            type: string
            minLength: 1
            maxLength: 200
          productId:
            type: string
            minLength: 1
            maxLength: 200
          title:
            type: string
            minLength: 1
            maxLength: 1000
          editorUrl:
            type: string
            format: uri
    records:
      type: array
      maxItems: 500
      items:
        type: object
    bindings:
      type: object
    reuseContexts:
      type: object
outputSchema:
  type: object
  additionalProperties: false
  required:
    - matcherVersion
    - matched
    - ambiguous
    - unmatched
    - inspectionQueue
    - ambiguityReview
  properties:
    matcherVersion:
      type: string
      const: packaging-smart-v1
    matched:
      type: array
      maxItems: 500
      items:
        type: object
    ambiguous:
      type: array
      maxItems: 500
      items:
        type: object
    unmatched:
      type: array
      maxItems: 500
      items:
        type: object
    ambiguityReview:
      type: object
      additionalProperties: false
      required:
        - batchRef
        - items
      properties:
        batchRef:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        items:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              - productRef
              - productId
              - candidates
            properties:
              productRef:
                type: string
                pattern: ^sha256:[a-f0-9]{64}$
              productId:
                type: string
              candidates:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - candidateRef
                    - recordId
                    - recordDigest
                  properties:
                    candidateRef:
                      type: string
                      pattern: ^sha256:[a-f0-9]{64}$
                    recordId:
                      type: string
                    recordDigest:
                      type: string
                      pattern: ^sha256:[a-f0-9]{64}$
    inspectionQueue:
      type: array
      maxItems: 500
      description: 按输入商品顺序生成；未匹配和歧义商品仍保留在基础只读检查队列中。
      items:
        type: object
        additionalProperties: false
        required:
          - product
          - packagingMatch
        properties:
          product:
            type: object
            additionalProperties: false
            required:
              - id
              - title
              - editorUrl
            properties:
              id:
                type: string
              title:
                type: string
              editorUrl:
                type: string
                format: uri
          packagingMatch:
            type: object
            additionalProperties: false
            required:
              - status
            properties:
              status:
                enum:
                  - matched
                  - ambiguous
                  - unmatched
              recordId:
                type: string
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 30s
  idempotency: pure
  cancellable: true
errors:
  - TEAM_HANDLER_INPUT_INVALID
  - TEAM_HANDLER_RESULT_LIMIT_EXCEEDED
  - TEAM_HANDLER_CANCELLED
  - TEAM_HANDLER_TIMEOUT
