apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: ecommerce.comparable-pool.build
  version: 1.0.0
  title: 构建可比商品池
  description: 依据类目空间、即食状态和独立包装边界，把候选分成直接竞品、替代内容参考和拒绝项。
runtime: engine_team
inputSchema:
  type: object
  additionalProperties: false
  required:
    - poolId
    - categorySpace
    - products
  properties:
    poolId:
      type: string
      minLength: 1
      maxLength: 200
    categorySpace:
      type: object
      required:
        - primaryCategory
      properties:
        primaryCategory:
          type: string
    products:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - productId
          - title
          - platformCategory
          - firstListedAt
          - metrics
          - attributes
          - comparisonSignals
          - assets
        properties:
          productId:
            type: string
          title:
            type: string
          brand:
            type: string
          platformCategory:
            type: string
          firstListedAt:
            type: string
            format: date
          metrics:
            type: object
          attributes:
            type: array
            items:
              type: string
          comparisonSignals:
            type: object
            additionalProperties: false
            required:
              - productForm
              - readyToEat
              - individualPack
              - functions
              - scenes
            properties:
              productForm:
                type: string
              readyToEat:
                type: boolean
              individualPack:
                type: boolean
              unitWeightG:
                type: number
              functions:
                type: array
                items:
                  type: string
              scenes:
                type: array
                items:
                  type: string
          assets:
            type: object
            additionalProperties: false
            required:
              - source
              - carouselCount
              - detailSliceCount
              - sourceManifest
              - selectedMain
            properties:
              source:
                type: string
              carouselCount:
                type: integer
              detailSliceCount:
                type: integer
              sourceManifest:
                type: string
              selectedMain:
                type: object
                required:
                  - path
                  - sha256
                properties:
                  path:
                    type: string
                  sha256:
                    type: string
                    pattern: "^[a-f0-9]{64}$"
outputSchema:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - poolId
    - comparisonRule
    - tiers
    - rejectedProducts
  properties:
    schemaVersion:
      const: comparable-pool/v0.2
    poolId:
      type: string
    comparisonRule:
      type: object
    tiers:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: object
        additionalProperties: false
        required:
          - tier
          - products
          - reason
        properties:
          tier:
            enum:
              - DIRECT_COMPETITOR
              - SUBSTITUTE_AND_CONTENT_REFERENCE
          products:
            type: array
            maxItems: 100
            items:
              type: string
          reason:
            type: string
    rejectedProducts:
      type: array
      maxItems: 100
      items:
        type: string
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 10s
  idempotency: pure
  cancellable: true
errors:
  - TEAM_HANDLER_INPUT_INVALID
  - TEAM_HANDLER_RESULT_LIMIT_EXCEEDED
  - TEAM_HANDLER_CANCELLED
  - TEAM_HANDLER_TIMEOUT
