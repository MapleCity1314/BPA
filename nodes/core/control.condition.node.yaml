apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: control.condition
  version: 1.1.0
  title: 安全条件分支
  description: 使用受限比较 DSL 分支，不执行任意 JavaScript。
runtime: engine_builtin
inputSchema:
  type: object
  additionalProperties: false
outputSchema:
  type: object
  additionalProperties: false
  required:
    - matched
  properties:
    matched:
      type: boolean
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 1s
  idempotency: pure
  cancellable: true
errors:
  - CONDITION_INVALID
