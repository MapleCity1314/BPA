apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: doudian.experience.daily.dataset.prepare
  version: 1.0.0
  title: 准备每日体验分 Dataset 发布意图
  description: 为完整或部分完成且至少含一条持久化事实的 Run 生成确定性发布意图；失败与跳过留在 Run 中，本 Node 不宣称 Dataset 已发布。
runtime: engine_builtin
inputSchema:
  type: object
  additionalProperties: false
  required: [daily]
  properties:
    daily:
      type: object
      additionalProperties: false
      required: [status, businessDate, observedAt, discoveredCount, collectableCount, attemptedCount, persistedCount, failedCount, skippedCount, factRefs, foreachOutcome]
      properties:
        status: { enum: [complete, partial] }
        businessDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        observedAt: { type: string, format: date-time }
        discoveredCount: { type: integer, minimum: 1, maximum: 100 }
        collectableCount: { type: integer, minimum: 0, maximum: 100 }
        attemptedCount: { type: integer, minimum: 0, maximum: 100 }
        persistedCount: { type: integer, minimum: 1, maximum: 100 }
        failedCount: { type: integer, minimum: 0, maximum: 100 }
        skippedCount: { type: integer, minimum: 0, maximum: 100 }
        factRefs:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [factKey, businessDate, subjectId, recordDigest]
            properties:
              factKey: { type: string, minLength: 1, maxLength: 500 }
              businessDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
              subjectId: { type: string, pattern: "^[0-9]{5,30}$" }
              recordDigest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        foreachOutcome: { type: object }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, datasetStatus, publicationIntentId, datasetId, version, recordCount, recordsDigest]
  properties:
    status: { const: prepared }
    datasetStatus: { enum: [complete, partial] }
    publicationIntentId: { type: string, minLength: 1, maxLength: 200 }
    datasetId: { const: doudian-experience-daily }
    version: { type: string, pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)-run\\.[0-9a-z]{8,32}$" }
    recordCount: { type: integer, minimum: 1, maximum: 100 }
    recordsDigest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
risk:
  level: R1
  permissions: [experience.dataset.prepare]
execution:
  timeoutDefault: 30s
  idempotency: verified_write
  cancellable: true
errors: [EXPERIENCE_DATASET_INCOMPLETE, EXPERIENCE_DATASET_FACT_MISMATCH, EXPERIENCE_DATASET_PERMISSION_MISMATCH, EXPERIENCE_DATASET_INTENT_CONFLICT, EXPERIENCE_DATASET_FENCE_INVALID, EXPERIENCE_DATASET_PREPARE_FAILED]
