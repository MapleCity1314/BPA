apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: inventory.shadow.product.compute
  version: 1.0.0
  title: 计算单商品影子库存风险
  description: 对固定商品快照和固定订单数据集逐 SKU 运行预测、渠道份额估算和均衡档风险评估，输出可独立持久化的版本化结果。
runtime: engine_team
inputSchema:
  type: object
  additionalProperties: false
  required: [evaluatedAt, envelope, inputs, lease]
  properties:
    evaluatedAt: { type: string, format: date-time }
    envelope: { type: object }
    inputs: { type: array, maxItems: 500, items: { type: object } }
    lease: { type: object }
outputSchema:
  type: object
  additionalProperties: false
  required: [forecasts, channelEstimates, persistableForecasts, evaluation]
  properties:
    forecasts: { type: object }
    channelEstimates: { type: object }
    persistableForecasts: { type: array, maxItems: 500, items: { type: object } }
    evaluation: { type: object }
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 30s
  idempotency: pure
  cancellable: true
errors: [TEAM_HANDLER_INPUT_INVALID, TEAM_HANDLER_RESULT_LIMIT_EXCEEDED, TEAM_HANDLER_CANCELLED]
