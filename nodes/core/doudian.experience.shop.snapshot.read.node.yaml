apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.experience.shop.snapshot.read
  version: 2.0.4
  title: 读取单店抖店体验分快照
  description: 在同一受管标签页内切店、读取三维体验分并恢复源店铺，不创建额外 Chrome 实例。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [shop, sourceShop]
  properties:
    shop: { $ref: "#/$defs/shop" }
    sourceShop: { $ref: "#/$defs/shop" }
  $defs:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      allOf:
        - if:
            properties: { status: { const: active } }
            required: [status]
          then:
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]{5,30}$" }
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, maxLength: 200 }
outputSchema:
  type: object
  additionalProperties: true
  required: [status, shop, diagnostics]
  properties:
    status: { enum: [complete, no_score, skipped] }
    shop: { type: object }
    observedAt: { type: string, format: date-time }
    sourceUpdatedAt: { type: [string, "null"], format: date-time }
    summary: { type: object }
    dimensions: { type: array, maxItems: 3 }
    evidence: { type: object }
    diagnostics: { type: array, maxItems: 100, items: { type: string, maxLength: 500 } }
    formMutations: { const: 0 }
risk:
  level: R1
  permissions: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 单标签页事务性切店、体验分读取和源上下文恢复
execution:
  timeoutDefault: 4m
  idempotency: repeatable_read
  retryableErrors: [PAGE_LOADING, BROWSER_DISCONNECTED, EXPERIENCE_PAGE_TIMEOUT, EXPERIENCE_CONTENT_RESPONSE_TIMEOUT]
  cancellable: true
  timingPolicy:
    rateLimit: { scope: authentication_context, minIntervalMs: 1000, maxQueueMs: 10000 }
errors: [AUTH_REQUIRED, BROWSER_DISCONNECTED, CAPTCHA_REQUIRED, COMMAND_CANCELLED, COMMAND_RESULT_TOO_LARGE, DEADLINE_EXCEEDED, EXPERIENCE_CONTENT_RESPONSE_TIMEOUT, EXPERIENCE_DIMENSION_INCOMPLETE, EXPERIENCE_PAGE_TIMEOUT, EXPERIENCE_SNAPSHOT_MISSING, EXPERIENCE_STAGE_FAILED, EXPERIENCE_TOTAL_SCORE_MISSING, PAGE_LOADING, PAGE_MISMATCH, PAGE_URL_INVALID, RISK_CONTROL, SESSION_EXPIRED, SHOP_CONTEXT_RESTORE_FAILED, SHOP_IDENTITY_MISMATCH, SHOP_IDENTITY_UNCERTAIN]
evidence: { required: [result, error] }
adapter: { id: doudian-experience, versions: [2.0.4] }
