apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: control.fail
  version: 1.0.0
  title: 明确失败结束流程
  description: 以固定错误码和说明结束 Workflow，避免把异常路径误记为成功。
runtime: engine_builtin
inputSchema:
  type: object
  additionalProperties: false
  required:
    - code
    - message
  properties:
    code:
      type: string
      pattern: ^[A-Z][A-Z0-9_]+$
    message:
      type: string
      minLength: 1
      maxLength: 1000
    details: {}
outputSchema: {}
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 1s
  idempotency: pure
  cancellable: true
errors:
  - WORKFLOW_FAILED
