apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: ecommerce.category-space.build
  version: 1.0.0
  title: 构建电商类目空间
  description: 从产品意图和有界商品快照中生成消费者需求空间与平台类目分支；以有效样本的主要官方类目作为直接竞争边界。
runtime: engine_team
inputSchema:
  type: object
  additionalProperties: false
  required:
    - intent
    - products
  properties:
    intent:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - intentId
        - researchObject
      properties:
        schemaVersion:
          const: product-intent/v0.2
        intentId:
          type: string
        researchObject:
          type: object
          additionalProperties: false
          required:
            - confirmed
            - workingBoundary
          properties:
            confirmed:
              type: array
              items:
                type: object
            workingBoundary:
              type: object
              additionalProperties: false
              required:
                - productForm
                - targetPeople
                - usageScenes
                - confidence
              properties:
                productForm:
                  type: string
                targetPeople:
                  type: array
                  items:
                    type: string
                usageScenes:
                  type: array
                  items:
                    type: string
                confidence:
                  type: string
    products:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "#/$defs/product"
    exclusionRules:
      type: array
      maxItems: 50
      items:
        type: string
        minLength: 1
        maxLength: 500
  $defs:
    product:
      type: object
      additionalProperties: false
      required:
        - productId
        - title
        - platformCategory
        - firstListedAt
        - metrics
        - attributes
        - comparisonSignals
        - assets
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 1000
        brand:
          type: string
          minLength: 1
          maxLength: 500
        platformCategory:
          type: string
          minLength: 1
          maxLength: 1000
        firstListedAt:
          type: string
          format: date
        metrics:
          type: object
        attributes:
          type: array
          maxItems: 50
          items:
            type: string
        comparisonSignals:
          type: object
          additionalProperties: false
          required:
            - productForm
            - readyToEat
            - individualPack
            - functions
            - scenes
          properties:
            productForm:
              type: string
            readyToEat:
              type: boolean
            individualPack:
              type: boolean
            unitWeightG:
              type: number
              exclusiveMinimum: 0
            functions:
              type: array
              items:
                type: string
            scenes:
              type: array
              items:
                type: string
        assets:
          type: object
          additionalProperties: false
          required:
            - source
            - carouselCount
            - detailSliceCount
            - sourceManifest
            - selectedMain
          properties:
            source:
              type: string
            carouselCount:
              type: integer
              minimum: 0
            detailSliceCount:
              type: integer
              minimum: 0
            sourceManifest:
              type: string
            selectedMain:
              type: object
              additionalProperties: false
              required:
                - path
                - sha256
              properties:
                path:
                  type: string
                sha256:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
outputSchema:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - intentId
    - principle
    - consumerNeedSpace
    - primaryCategory
    - platformCategoryBranches
    - exclusionRules
  properties:
    schemaVersion:
      const: category-space/v0.2
    intentId:
      type: string
    principle:
      type: string
    consumerNeedSpace:
      type: object
      additionalProperties: false
      required:
        - coreNeed
        - functions
        - scenes
      properties:
        coreNeed:
          type: string
        functions:
          type: array
          items:
            type: string
        scenes:
          type: array
          items:
            type: string
    primaryCategory:
      type: string
    platformCategoryBranches:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - path
          - role
          - observedProducts
        properties:
          path:
            type: string
          role:
            enum:
              - PRIMARY_DIRECT_BOUNDARY
              - SCENE_AND_CONTENT_REFERENCE
          observedProducts:
            type: array
            items:
              type: string
    exclusionRules:
      type: array
      items:
        type: string
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 10s
  idempotency: pure
  cancellable: true
errors:
  - TEAM_HANDLER_INPUT_INVALID
  - TEAM_HANDLER_RESULT_LIMIT_EXCEEDED
  - TEAM_HANDLER_CANCELLED
  - TEAM_HANDLER_TIMEOUT
