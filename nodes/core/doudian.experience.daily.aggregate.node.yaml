apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.experience.daily.aggregate
  version: 1.0.0
  title: 聚合抖店每日体验分结果
  description: 聚合逐店运行输出，保留完整、无分、失败与跳过数量，不把部分成功压成无数据。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [foreachOutcome]
  properties:
    foreachOutcome: { type: object }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, businessDate, observedAt, discoveredCount, attemptedCount, persistedCount, failedCount, skippedCount, snapshots, foreachOutcome]
  properties:
    status: { enum: [complete, partial, failed] }
    businessDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    observedAt: { type: string, format: date-time }
    discoveredCount: { type: integer, minimum: 0, maximum: 100 }
    attemptedCount: { type: integer, minimum: 0, maximum: 100 }
    persistedCount: { type: integer, minimum: 0, maximum: 100 }
    failedCount: { type: integer, minimum: 0, maximum: 100 }
    skippedCount: { type: integer, minimum: 0, maximum: 100 }
    snapshots: { type: array, maxItems: 100, items: { type: object } }
    foreachOutcome: { type: object }
risk:
  level: R0
  permissions: [browser.dom.read, browser.tabs.read]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.tabs.read]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 绑定同一运行资源以聚合已形成检查点的逐店结果
execution:
  timeoutDefault: 10s
  idempotency: repeatable_read
  cancellable: true
errors: [DOUDIAN_EXPERIENCE_OUTCOME_INVALID]
evidence: { required: [result, error] }
adapter: { id: doudian-experience, versions: [1.0.0] }
