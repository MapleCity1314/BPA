apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.alliance.retired-products.aggregate
  version: 1.0.0
  title: 汇总联盟清退商品巡检
  description: 将 Workflow foreach 的逐店结果汇总为完整空、完整有商品或部分完成三种业务状态。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [foreachOutcome]
  properties:
    foreachOutcome: { type: object }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, businessDate, observedAt, discoveredShopCount, scannedShopCount, failedShopCount, affectedShopCount, retiredProductCount, shops, foreachOutcome]
  properties:
    status: { enum: [complete_empty, complete_with_items, partial] }
    businessDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    observedAt: { type: string, format: date-time }
    discoveredShopCount: { type: integer, minimum: 0, maximum: 100 }
    scannedShopCount: { type: integer, minimum: 0, maximum: 100 }
    failedShopCount: { type: integer, minimum: 0, maximum: 100 }
    affectedShopCount: { type: integer, minimum: 0, maximum: 100 }
    retiredProductCount: { type: integer, minimum: 0, maximum: 500 }
    shops: { type: array, maxItems: 100 }
    foreachOutcome: { type: object }
risk:
  level: R0
  permissions: [browser.dom.read, browser.tabs.read]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.tabs.read]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 在同一已绑定页面上下文中确定性汇总逐店结果
execution:
  timeoutDefault: 10s
  idempotency: repeatable_read
  retryableErrors: []
  cancellable: true
errors: [DOUDIAN_ALLIANCE_OUTCOME_INVALID]
evidence: { required: [result, error] }
adapter: { id: doudian-alliance, versions: [1.0.0] }
