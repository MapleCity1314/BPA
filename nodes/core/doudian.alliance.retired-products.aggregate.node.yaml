apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.alliance.retired-products.aggregate
  version: 2.0.0
  title: 汇总联盟清退商品巡检
  description: 由 Core 读取当前 Run 已持久化的逐店事实，并结合受控发现清单和 foreach 标记计算完整空、完整有商品、部分或失败状态。
runtime: engine_builtin
inputSchema:
  type: object
  additionalProperties: false
  required: [foreachOutcome, discoveredShops, discoveredCount, collectableCount]
  properties:
    foreachOutcome: { type: object }
    discoveredShops:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [key, name, status, statusText]
        allOf:
          - if:
              properties: { status: { const: active } }
              required: [status]
            then:
              required: [id]
              properties:
                id: { type: string, pattern: "^[0-9]{5,30}$" }
        properties:
          key: { type: string, minLength: 3, maxLength: 120 }
          id: { type: string, pattern: "^[0-9]{5,30}$" }
          name: { type: string, minLength: 2, maxLength: 80 }
          status: { enum: [active, blocked] }
          statusText: { type: string, minLength: 1, maxLength: 200 }
    discoveredCount: { type: integer, minimum: 1, maximum: 100 }
    collectableCount: { type: integer, minimum: 0, maximum: 100 }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, businessDate, observedAt, discoveredCount, collectableCount, attemptedCount, persistedCount, failedCount, skippedCount, affectedShopCount, retiredProductCount, factRefs, shops, foreachOutcome]
  properties:
    status: { enum: [complete_empty, complete_with_items, partial, failed] }
    businessDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    observedAt: { type: string, format: date-time }
    discoveredCount: { type: integer, minimum: 0, maximum: 100 }
    collectableCount: { type: integer, minimum: 0, maximum: 100 }
    attemptedCount: { type: integer, minimum: 0, maximum: 100 }
    persistedCount: { type: integer, minimum: 0, maximum: 100 }
    failedCount: { type: integer, minimum: 0, maximum: 100 }
    skippedCount: { type: integer, minimum: 0, maximum: 100 }
    affectedShopCount: { type: integer, minimum: 0, maximum: 100 }
    retiredProductCount: { type: integer, minimum: 0, maximum: 5000 }
    factRefs:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [factKey, businessDate, subjectId, recordDigest]
        properties:
          factKey: { type: string, minLength: 1, maxLength: 500 }
          businessDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          subjectId: { type: string, pattern: "^[0-9]{5,30}$" }
          recordDigest: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
    shops:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required: [shop, status, retiredCount]
        properties:
          shop:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string, pattern: "^[0-9]{5,30}$" }
              name: { type: string, minLength: 2, maxLength: 80 }
          status: { enum: [complete_empty, complete_with_items] }
          retiredCount: { type: integer, minimum: 0, maximum: 50 }
    foreachOutcome: { type: object }
risk:
  level: R0
  permissions: [alliance.retired.fact.read]
execution:
  timeoutDefault: 10s
  idempotency: repeatable_read
  retryableErrors: []
  cancellable: true
errors: [DOUDIAN_ALLIANCE_OUTCOME_INVALID, ALLIANCE_RETIRED_FACT_PERMISSION_MISMATCH, ALLIANCE_RETIRED_FACT_SCOPE_MISMATCH, ALLIANCE_RETIRED_FACT_DUPLICATE, ALLIANCE_RETIRED_FACT_STORE_FAILED]
evidence: { required: [result, error] }
