apiVersion: bpa/v1alpha1
kind: Node
metadata:
  id: ecommerce.reference-pack.build
  version: 1.0.0
  title: 构建设计参考资产包
  description: 将可比层级、证据等级和已有 AssetRef 组合成供美工与图片生成使用的参考包清单；不复制图片二进制。
runtime: engine_team
inputSchema:
  type: object
  additionalProperties: false
  required:
    - packId
    - sourceRunId
    - comparablePool
    - evidence
    - products
  properties:
    packId:
      type: string
      minLength: 1
      maxLength: 200
    sourceRunId:
      type: string
      minLength: 1
      maxLength: 200
    comparablePool:
      type: object
      required:
        - tiers
      properties:
        tiers:
          type: array
          items:
            type: object
    evidence:
      type: object
      required:
        - schemaVersion
      properties:
        schemaVersion:
          type: string
    products:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
          - productId
          - title
          - platformCategory
          - firstListedAt
          - metrics
          - attributes
          - comparisonSignals
          - assets
        properties:
          productId:
            type: string
          title:
            type: string
          brand:
            type: string
          platformCategory:
            type: string
          firstListedAt:
            type: string
            format: date
          metrics:
            type: object
          attributes:
            type: array
            items:
              type: string
          comparisonSignals:
            type: object
            required:
              - productForm
              - readyToEat
              - individualPack
              - functions
              - scenes
            properties:
              productForm:
                type: string
              readyToEat:
                type: boolean
              individualPack:
                type: boolean
              unitWeightG:
                type: number
              functions:
                type: array
                items:
                  type: string
              scenes:
                type: array
                items:
                  type: string
          assets:
            type: object
            additionalProperties: false
            required:
              - source
              - carouselCount
              - detailSliceCount
              - sourceManifest
              - selectedMain
            properties:
              source:
                type: string
              carouselCount:
                type: integer
                minimum: 0
              detailSliceCount:
                type: integer
                minimum: 0
              sourceManifest:
                type: string
              selectedMain:
                type: object
                additionalProperties: false
                required:
                  - path
                  - sha256
                properties:
                  path:
                    type: string
                  sha256:
                    type: string
                    pattern: "^[a-f0-9]{64}$"
outputSchema:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - packId
    - sourceRunId
    - status
    - usage
    - evidenceSchemaVersion
    - summary
    - assetGroups
    - selectedAssets
  properties:
    schemaVersion:
      const: reference-asset-pack/v0.2
    packId:
      type: string
    sourceRunId:
      type: string
    status:
      const: READY_WITH_E1_E2_LIMIT
    usage:
      type: string
    evidenceSchemaVersion:
      type: string
    summary:
      type: object
      additionalProperties: false
      required:
        - productCount
        - directCompetitorCount
        - carouselCount
        - detailSliceCount
      properties:
        productCount:
          type: integer
          minimum: 0
        directCompetitorCount:
          type: integer
          minimum: 0
        carouselCount:
          type: integer
          minimum: 0
        detailSliceCount:
          type: integer
          minimum: 0
    assetGroups:
      type: array
      maxItems: 100
      items:
        type: object
    selectedAssets:
      type: array
      maxItems: 100
      items:
        type: object
risk:
  level: R0
  permissions: []
execution:
  timeoutDefault: 10s
  idempotency: pure
  cancellable: true
errors:
  - TEAM_HANDLER_INPUT_INVALID
  - TEAM_HANDLER_RESULT_LIMIT_EXCEEDED
  - TEAM_HANDLER_CANCELLED
  - TEAM_HANDLER_TIMEOUT
