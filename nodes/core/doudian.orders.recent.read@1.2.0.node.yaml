apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.orders.recent.read
  version: 1.2.0
  title: 读取抖店近期订单需求（固定只读接口）
  description: 在已登录订单页通过固定同源只读接口读取 60–180 分钟订单窗口，仅提取需求白名单字段，不返回买家姓名、电话、地址或完整订单 JSON；旧页面保留受限 DOM 回退。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [shopId, shopName, lookbackMinutes]
  properties:
    shopId: { type: string, minLength: 1, maxLength: 200 }
    shopName: { type: string, minLength: 2, maxLength: 200 }
    lookbackMinutes: { type: integer, minimum: 60, maximum: 180 }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, readerVersion, observedAt, shop, records, quality, redactedFields, formMutations]
  properties:
    status: { const: complete }
    readerVersion: { const: 1.2.0 }
    observedAt: { type: string, format: date-time }
    shop: { type: object }
    records: { type: array, maxItems: 500, items: { type: object } }
    quality: { type: object }
    redactedFields: { type: array, items: { type: string } }
    formMutations: { const: 0 }
risk:
  level: R1
  permissions: [browser.dom.read,browser.dom.write,browser.tabs.read]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read,browser.dom.write,browser.tabs.read]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 通过固定同源只读接口采集受限订单时间窗
execution:
  timeoutDefault: 3m
  idempotency: repeatable_read
  cancellable: true
errors: [PAGE_MISMATCH,SHOP_IDENTITY_MISMATCH,RECENT_ORDER_PAGE_TIMEOUT,RECENT_ORDER_STRUCTURE_UNCONFIRMED,RECENT_ORDER_LIST_INCOMPLETE,RECENT_ORDER_ROWS_UNREADABLE,RECENT_ORDER_ROWS_DUPLICATED,RECENT_ORDER_RESULT_LIMIT_EXCEEDED,CAPTCHA_REQUIRED,RATE_LIMITED,RISK_CONTROL,SESSION_EXPIRED]
evidence: { required: [result,error] }
adapter: { id: doudian-inventory,versions: [1.0.0] }
