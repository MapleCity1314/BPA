apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.orders.recent.read
  version: 1.0.0
  title: 读取抖店近期订单需求
  description: 从冻结的已登录订单页只提取订单需求白名单字段，不返回买家姓名、电话、地址或完整订单 JSON。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [shopId, shopName]
  properties:
    shopId: { type: string, minLength: 1, maxLength: 200 }
    shopName: { type: string, minLength: 2, maxLength: 200 }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, readerVersion, observedAt, shop, records, quality, redactedFields, formMutations]
  properties:
    status: { const: complete }
    readerVersion: { const: 1.0.0 }
    observedAt: { type: string, format: date-time }
    shop: { type: object }
    records: { type: array, maxItems: 500, items: { type: object } }
    quality: { type: object }
    redactedFields: { type: array, items: { type: string } }
    formMutations: { const: 0 }
risk:
  level: R0
  permissions: [browser.dom.read,browser.tabs.read]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read,browser.tabs.read]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 冻结抖店订单页，只读补充最近订单热数据
execution:
  timeoutDefault: 2m
  idempotency: repeatable_read
  cancellable: true
errors: [PAGE_MISMATCH,SHOP_IDENTITY_MISMATCH,RECENT_ORDER_STRUCTURE_UNCONFIRMED,RECENT_ORDER_LIST_INCOMPLETE,RECENT_ORDER_ROWS_UNREADABLE,RECENT_ORDER_ROWS_DUPLICATED,RECENT_ORDER_RESULT_LIMIT_EXCEEDED,CAPTCHA_REQUIRED,RATE_LIMITED,RISK_CONTROL,SESSION_EXPIRED]
evidence: { required: [result,error] }
adapter: { id: doudian-inventory,versions: [1.0.0] }
