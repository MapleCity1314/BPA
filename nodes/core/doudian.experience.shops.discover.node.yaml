apiVersion: bpa/v1alpha2
kind: Node
metadata:
  id: doudian.experience.shops.discover
  version: 2.0.0
  title: 发现抖店体验分店铺
  description: 在已绑定的抖店商品列表标签页枚举可切换店铺并冻结源店铺身份。
runtime: browser
inputSchema:
  type: object
  additionalProperties: false
  required: [maxShops]
  properties:
    maxShops: { type: integer, minimum: 1, maximum: 100 }
outputSchema:
  type: object
  additionalProperties: false
  required: [status, shops, sourceShop, discoveredCount, collectableCount, observedAt, diagnostics]
  properties:
    status: { const: complete }
    shops:
      type: array
      minItems: 1
      maxItems: 100
      items: { $ref: "#/$defs/shop" }
    sourceShop: { $ref: "#/$defs/shop" }
    discoveredCount: { type: integer, minimum: 1, maximum: 100 }
    collectableCount: { type: integer, minimum: 0, maximum: 100 }
    observedAt: { type: string, format: date-time }
    diagnostics: { type: array, maxItems: 100, items: { type: string, maxLength: 500 } }
  $defs:
    shop:
      type: object
      additionalProperties: false
      required: [key, name, status, statusText]
      allOf:
        - if:
            properties: { status: { const: active } }
            required: [status]
          then:
            required: [id]
            properties:
              id: { type: string, pattern: "^[0-9]{5,30}$" }
      properties:
        key: { type: string, minLength: 3, maxLength: 120 }
        id: { type: string, pattern: "^[0-9]{5,30}$" }
        name: { type: string, minLength: 2, maxLength: 80 }
        status: { enum: [active, blocked] }
        statusText: { type: string, maxLength: 200 }
risk:
  level: R1
  permissions: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
  domains: [https://fxg.jinritemai.com]
resources:
  browser:
    kind: browser
    capabilities: [browser.dom.read, browser.dom.write, browser.tabs.read, browser.tabs.navigate]
    allowedOrigins: [https://fxg.jinritemai.com]
    authentication: authenticated
    purpose: 复用一个已登录 Mac Chrome 标签页发现体验分采集范围
execution:
  timeoutDefault: 2m
  idempotency: repeatable_read
  retryableErrors: [PAGE_LOADING, BROWSER_DISCONNECTED]
  cancellable: true
errors: [AUTH_REQUIRED, BROWSER_DISCONNECTED, CAPTCHA_REQUIRED, COMMAND_CANCELLED, COMMAND_RESULT_TOO_LARGE, DEADLINE_EXCEEDED, DOUDIAN_EXPERIENCE_DISCOVERY_FAILED, DOUDIAN_EXPERIENCE_MAX_SHOPS_INVALID, PAGE_LOADING, PAGE_MISMATCH, RISK_CONTROL, SESSION_EXPIRED, SHOP_IDENTITY_AMBIGUOUS, SHOP_IDENTITY_UNCERTAIN, SHOP_IDENTITY_UNCONFIRMED, SHOP_LIMIT_EXCEEDED, SHOP_LIST_EMPTY, SHOP_LIST_INCOMPLETE]
evidence: { required: [result, error] }
adapter: { id: doudian-experience, versions: [2.0.0] }
