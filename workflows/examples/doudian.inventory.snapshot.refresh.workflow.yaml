apiVersion: bpa/v1alpha3
kind: Workflow
metadata:
  id: doudian.inventory.snapshot.refresh
  version: 1.0.0
  title: 刷新抖店全量库存快照
  description: 校验当前店铺名称，完整对账全部在售商品，并逐商品只读采集、立即持久化 SKU 与渠道库存。
spec:
  riskLevel: R1
  inputSchema:
    type: object
    additionalProperties: false
    required: [shopId, shopName, lease]
    properties:
      shopId: { type: string, minLength: 1, maxLength: 200 }
      shopName: { type: string, minLength: 2, maxLength: 200 }
      lease: { type: object }
  outputSchema:
    type: object
  limits: { maxDepth: 3, maxStepExecutions: 5000 }
  resourceSlots:
    doudian_browser:
      kind: browser
      capabilities: [browser.dom.read, browser.dom.write, browser.tabs.read]
      allowedOrigins: [https://fxg.jinritemai.com]
      authentication: authenticated
      purpose: 冻结已登录的商品管理标签页，全程只读扫描在售商品库存
  root:
    kind: sequence
    steps:
      - key: read_shop
        kind: call
        use: doudian.shop.context.read@1.3.0
        resourceMappings: { browser: doudian_browser }
        timeout: 15s
      - key: shop_name_gate
        kind: decision
        condition:
          kind: compare
          operator: equals
          left: { kind: binding, binding: "${steps.read_shop.output.shop.name}" }
          right: { kind: binding, binding: "${input.shopName}" }
        then:
          kind: sequence
          steps:
            - key: collect_scope
              kind: call
              use: doudian.product.scope.collect@1.1.0
              resourceMappings: { browser: doudian_browser }
              timeout: 10m
            - key: snapshot_products
              kind: foreach
              items: ${steps.collect_scope.output.inspectionQueue}
              itemName: product
              indexName: product_index
              itemKey: ${item.id}
              maxItems: 500
              maxDuration: 8h
              onItemError: stop
              body:
                kind: sequence
                steps:
                  - key: read_snapshot
                    kind: call
                    use: doudian.inventory.product.snapshot.read@1.0.0
                    resourceMappings: { browser: doudian_browser }
                    with:
                      shop:
                        id: ${steps.read_shop.output.shop.id}
                        name: ${steps.read_shop.output.shop.name}
                      product: { id: "${item.id}", title: "${item.title}" }
                    timeout: 2m
                  - key: persist_snapshot
                    kind: call
                    use: inventory.snapshot.persist@1.0.0
                    with:
                      snapshot: ${steps.read_snapshot.output}
                      lease: ${input.lease}
                    timeout: 30s
            - key: completed
              kind: terminal
              status: succeeded
              output:
                shop: ${steps.read_shop.output.shop}
                scope: ${steps.collect_scope.output}
                snapshots: ${steps.snapshot_products.output}
        else:
          kind: sequence
          steps:
            - key: wrong_shop
              kind: terminal
              status: uncertain
              error:
                code: SHOP_IDENTITY_MISMATCH
                message: 当前抖店页面店铺名称与工作流固定目标不一致，已停止只读采集。
