apiVersion: bpa/v1alpha3
kind: Workflow
metadata:
  id: ecommerce.cross-platform-evidence-probe
  version: 2.0.0
  title: 三平台参考图片证据包
  description: 从同一 Run 的抖音、淘宝和京东 Browser Evidence 冻结候选图片，受限物化到 BPA CAS，经人工确认角色与禁止推断后发布内部参考 Export。
spec:
  riskLevel: R1
  inputSchema:
    type: object
    additionalProperties: false
    required: [intent, poolId, packId, observedAt, comparisonRules, exclusionRules, maxItems]
    properties:
      intent:
        type: object
        additionalProperties: false
        required: [intentId, platform, seedQuery, researchGoal, workingBoundary]
        properties:
          intentId: { type: string }
          platform: { type: string }
          seedQuery: { type: string }
          researchGoal: { type: string }
          workingBoundary: { type: object }
      poolId: { type: string, minLength: 1 }
      packId:
        type: string
        minLength: 1
        maxLength: 120
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      observedAt: { type: string, format: date-time }
      comparisonRules:
        type: object
        additionalProperties: false
        required: [coreTerms, packagingTerms, excludeTerms]
        properties:
          coreTerms: { type: array, minItems: 1, maxItems: 30, items: { type: string } }
          packagingTerms: { type: array, minItems: 1, maxItems: 30, items: { type: string } }
          excludeTerms: { type: array, maxItems: 50, items: { type: string } }
      exclusionRules: { type: array, maxItems: 50, items: { type: string } }
      maxItems: { type: integer, minimum: 1, maximum: 50 }
  outputSchema:
    type: object
    additionalProperties: false
    required: [status, productIntent, discovery, categorySpace, comparablePool, evidenceClaims, candidateReferencePack]
    properties:
      status: { enum: [no_reference_assets, ready_internal_reference] }
      productIntent: { type: object }
      discovery: { type: object }
      categorySpace: { type: object }
      comparablePool: { type: object }
      evidenceClaims: { type: object }
      candidateReferencePack: { type: object }
      materialization: { type: object }
      publishedReferencePack: { type: object }
  limits: { maxDepth: 3, maxStepExecutions: 60 }
  resourceSlots:
    douyin_page:
      kind: browser
      capabilities: [browser.dom.read, browser.tabs.read]
      allowedOrigins: [https://www.douyin.com]
      authentication: optional
      purpose: 绑定关键词一致的抖音商品搜索页
    taobao_page:
      kind: browser
      capabilities: [browser.dom.read, browser.tabs.read]
      allowedOrigins: [https://s.taobao.com]
      authentication: optional
      purpose: 绑定关键词一致的淘宝商品搜索页
    jd_page:
      kind: browser
      capabilities: [browser.dom.read, browser.tabs.read]
      allowedOrigins: [https://search.jd.com]
      authentication: optional
      purpose: 绑定关键词一致的京东商品搜索页
  root:
    kind: sequence
    steps:
      - key: normalize_intent
        kind: call
        use: ecommerce.intent.normalize@1.0.0
        with: ${input.intent}
        timeout: 5s
      - key: probe_douyin
        kind: call
        use: ecommerce.marketplace.search-results.read@1.0.0
        resourceMappings: { browser: douyin_page }
        with: { platform: DOUYIN, query: "${input.intent.seedQuery}", maxItems: "${input.maxItems}" }
        timeout: 30s
      - key: probe_taobao
        kind: call
        use: ecommerce.marketplace.search-results.read@1.0.0
        resourceMappings: { browser: taobao_page }
        with: { platform: TAOBAO, query: "${input.intent.seedQuery}", maxItems: "${input.maxItems}" }
        timeout: 30s
      - key: probe_jd
        kind: call
        use: ecommerce.marketplace.search-results.read@1.0.0
        resourceMappings: { browser: jd_page }
        with: { platform: JD, query: "${input.intent.seedQuery}", maxItems: "${input.maxItems}" }
        timeout: 30s
      - key: merge_discovery
        kind: call
        use: ecommerce.discovery.merge@1.0.0
        with:
          intent: ${steps.normalize_intent.output}
          probes: ["${steps.probe_douyin.output}", "${steps.probe_taobao.output}", "${steps.probe_jd.output}"]
        timeout: 10s
      - key: build_category_space
        kind: call
        use: ecommerce.discovery.category-space.build@1.0.0
        with:
          intent: ${steps.normalize_intent.output}
          discovery: ${steps.merge_discovery.output}
          exclusionRules: ${input.exclusionRules}
        timeout: 10s
      - key: build_comparable_pool
        kind: call
        use: ecommerce.discovery.comparable-pool.build@1.0.0
        with:
          poolId: ${input.poolId}
          categorySpace: ${steps.build_category_space.output}
          discovery: ${steps.merge_discovery.output}
          rules: ${input.comparisonRules}
        timeout: 10s
      - key: evaluate_evidence
        kind: call
        use: ecommerce.discovery.evidence.evaluate@1.0.0
        with:
          observedAt: ${input.observedAt}
          discovery: ${steps.merge_discovery.output}
          comparablePool: ${steps.build_comparable_pool.output}
        timeout: 10s
      - key: build_reference_pack
        kind: call
        use: ecommerce.discovery.reference-pack.build@2.0.0
        with:
          packId: ${input.packId}
          discovery: ${steps.merge_discovery.output}
          comparablePool: ${steps.build_comparable_pool.output}
          evidence: ${steps.evaluate_evidence.output}
        timeout: 10s
      - key: reference_assets_available
        kind: decision
        condition:
          kind: compare
          operator: equals
          left:
            kind: binding
            binding: ${steps.build_reference_pack.output.status}
          right:
            kind: literal
            value: PROVISIONAL_REMOTE_ASSETS
        then:
          kind: sequence
          steps:
            - key: materialize_reference_assets
              kind: call
              use: ecommerce.reference-assets.materialize@1.0.0
              with:
                packId: ${input.packId}
                referencePack: ${steps.build_reference_pack.output}
                sourceEvidence:
                  douyin: ${steps.probe_douyin.evidence}
                  taobao: ${steps.probe_taobao.evidence}
                  jd: ${steps.probe_jd.evidence}
              timeout: 5m
            - key: curate_reference_assets
              kind: wait.assistance
              use: reference_asset_curation@1.0.0
              with:
                packId: ${input.packId}
                materialization: ${steps.materialize_reference_assets.output}
              blocking: true
              deadline: 24h
              onUnavailable: fail
            - key: publish_reference_pack
              kind: call
              use: ecommerce.reference-pack.publish@1.0.0
              with:
                materialization: ${steps.materialize_reference_assets.output}
                curation: ${steps.curate_reference_assets.output}
              timeout: 30s
            - key: completed_with_reference_assets
              kind: terminal
              status: succeeded
              output:
                status: ready_internal_reference
                productIntent: ${steps.normalize_intent.output}
                discovery: ${steps.merge_discovery.output}
                categorySpace: ${steps.build_category_space.output}
                comparablePool: ${steps.build_comparable_pool.output}
                evidenceClaims: ${steps.evaluate_evidence.output}
                candidateReferencePack: ${steps.build_reference_pack.output}
                materialization: ${steps.materialize_reference_assets.output}
                publishedReferencePack: ${steps.publish_reference_pack.output}
        else:
          kind: sequence
          steps:
            - key: completed_without_reference_assets
              kind: terminal
              status: succeeded
              output:
                status: no_reference_assets
                productIntent: ${steps.normalize_intent.output}
                discovery: ${steps.merge_discovery.output}
                categorySpace: ${steps.build_category_space.output}
                comparablePool: ${steps.build_comparable_pool.output}
                evidenceClaims: ${steps.evaluate_evidence.output}
                candidateReferencePack: ${steps.build_reference_pack.output}
