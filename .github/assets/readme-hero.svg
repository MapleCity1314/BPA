<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">BPA architecture overview</title>
  <desc id="desc">Human and AI requests enter a versioned workflow engine, pass through the Browser Gateway and Extension Bridge, and execute in a real browser.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #ffffff;
      --ink: #0a0a0a;
      --muted: #666666;
      --faint: #eaeaea;
      --panel: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #000000;
        --ink: #ededed;
        --muted: #a1a1a1;
        --faint: #262626;
        --panel: #0a0a0a;
      }
    }
    text {
      fill: var(--ink);
      font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .mono {
      font-family: "Geist Mono", "SFMono-Regular", Consolas, monospace;
    }
    .muted {
      fill: var(--muted);
    }
    .line {
      fill: none;
      stroke: var(--faint);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .ink-line {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }
  </style>

  <rect width="1280" height="640" fill="var(--canvas)"/>

  <g class="line" opacity="0.8">
    <path d="M64 0V640M192 0V640M320 0V640M448 0V640M576 0V640M704 0V640M832 0V640M960 0V640M1088 0V640M1216 0V640"/>
    <path d="M0 64H1280M0 192H1280M0 320H1280M0 448H1280M0 576H1280"/>
  </g>

  <rect x="32.5" y="32.5" width="1215" height="575" rx="0" fill="none" stroke="var(--faint)"/>

  <text x="64" y="84" font-size="16" font-weight="600">BPA</text>
  <text x="101" y="84" class="muted" font-size="16">/ Browser Process Assistance</text>
  <text x="1216" y="84" class="mono muted" font-size="13" text-anchor="end">RUNTIME 0.2.1</text>

  <text x="64" y="184" font-size="72" font-weight="600" letter-spacing="-4">Real browser.</text>
  <text x="64" y="260" font-size="72" font-weight="600" letter-spacing="-4">Bounded execution.</text>

  <text x="68" y="304" class="muted" font-size="18">
    Versioned workflows coordinate deterministic actions in the user’s current browser session.
  </text>

  <g transform="translate(64 368)">
    <text x="0" y="0" class="mono muted" font-size="12">TRIGGER</text>
    <text x="0" y="40" font-size="20" font-weight="600">Human / AI</text>
    <circle cx="8" cy="84" r="8" fill="var(--ink)"/>

    <path class="ink-line" d="M40 84H256"/>
    <path d="M248 78L256 84L248 90" fill="none" stroke="var(--ink)" stroke-width="1.5"/>

    <text x="288" y="0" class="mono muted" font-size="12">CONTROL</text>
    <text x="288" y="40" font-size="20" font-weight="600">Workflow Engine</text>
    <rect x="288.5" y="68.5" width="176" height="31" fill="var(--panel)" stroke="var(--ink)"/>
    <text x="376" y="89" class="mono" font-size="11" text-anchor="middle">VERSION + POLICY</text>

    <path class="ink-line" d="M496 84H672"/>
    <path d="M664 78L672 84L664 90" fill="none" stroke="var(--ink)" stroke-width="1.5"/>

    <text x="704" y="0" class="mono muted" font-size="12">PROTOCOL</text>
    <text x="704" y="40" font-size="20" font-weight="600">Gateway ⇄ Bridge</text>
    <g class="mono" font-size="10">
      <rect x="704.5" y="68.5" width="42" height="31" fill="var(--ink)" stroke="var(--ink)"/>
      <text x="725.5" y="88.5" fill="var(--canvas)" text-anchor="middle">CMD</text>
      <rect x="752.5" y="68.5" width="42" height="31" fill="var(--panel)" stroke="var(--ink)"/>
      <text x="773.5" y="88.5" text-anchor="middle">ACK</text>
      <rect x="800.5" y="68.5" width="42" height="31" fill="var(--panel)" stroke="var(--ink)"/>
      <text x="821.5" y="88.5" text-anchor="middle">EVD</text>
    </g>

    <path class="ink-line" d="M874 84H984"/>
    <path d="M976 78L984 84L976 90" fill="none" stroke="var(--ink)" stroke-width="1.5"/>

    <text x="1016" y="0" class="mono muted" font-size="12">EXECUTION</text>
    <text x="1016" y="40" font-size="20" font-weight="600">Browser DOM</text>
    <path d="M1016.5 68.5H1151.5V99.5H1016.5Z" fill="var(--panel)" stroke="var(--ink)"/>
    <circle cx="1033" cy="84" r="4" fill="var(--ink)"/>
    <path class="line" d="M1046 84H1136"/>
  </g>

  <text x="64" y="572" class="mono muted" font-size="12">bpa.browser/1</text>
  <text x="1216" y="572" class="mono muted" font-size="12" text-anchor="end">PERMISSION · FENCING · EVIDENCE · RECOVERY</text>
</svg>
