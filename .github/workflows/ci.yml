name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  verify-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  performance-gate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm performance:check

  release-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify release build host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          node -e '
            if (
              process.platform !== "darwin" ||
              process.arch !== "arm64" ||
              process.versions.node.split(".")[0] !== "24"
            ) process.exit(1);
          '
      - run: pnpm install --frozen-lockfile
      - name: Build and verify immutable RC archive
        run: |
          commit="$(git rev-parse HEAD)"
          version="$(node -p 'require("./package.json").version')"
          node_version="$(node -p 'process.versions.node')"
          identity="v${version}-rc.${commit:0:12}.node${node_version}"
          archive="$RUNNER_TEMP/bpa-local-${identity}-macos-arm64.tar.gz"
          BPA_BUNDLED_NODE="$(command -v node)" \
            BPA_PACKAGE_OUTPUT="$archive" \
            zsh scripts/package-macos-arm64.sh
          zsh scripts/verify-package-macos-arm64.sh "$archive"
      - name: Upload verified RC archive
        uses: actions/upload-artifact@v6
        with:
          name: bpa-macos-arm64-rc
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bpa-local-*-macos-arm64.tar.gz
            ${{ runner.temp }}/bpa-local-*-macos-arm64.tar.gz.sha256

  release-package-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        builder: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify immutable Windows RC archive
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          $version = node -p 'require("./package.json").version'
          $nodeVersion = node -p 'process.versions.node'
          $identity = "v$version-rc.$($commit.Substring(0, 12)).node$nodeVersion"
          $firstDirectory = Join-Path $env:RUNNER_TEMP "build-first"
          $secondDirectory = Join-Path $env:RUNNER_TEMP "build-second"
          New-Item -ItemType Directory -Path $firstDirectory, $secondDirectory -Force | Out-Null
          $firstArchive = Join-Path $firstDirectory "bpa-local-$identity-windows-x64.zip"
          $secondArchive = Join-Path $secondDirectory "bpa-local-$identity-windows-x64.zip"
          ./scripts/package-windows-x64.ps1 -Output $firstArchive
          ./scripts/package-windows-x64.ps1 -Output $secondArchive
          ./scripts/verify-package-windows-x64.ps1 -Archive $firstArchive
          ./scripts/verify-package-windows-x64.ps1 -Archive $secondArchive
          ./scripts/compare-windows-runtime-archives.ps1 `
            -FirstArchive $firstArchive `
            -SecondArchive $secondArchive
      - name: Upload verified Windows RC archive
        uses: actions/upload-artifact@v6
        with:
          name: bpa-windows-x64-rc-builder-${{ matrix.builder }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/build-first/bpa-local-*-windows-x64.zip
            ${{ runner.temp }}/build-first/bpa-local-*-windows-x64.zip.sha256

  verify-windows-reproducibility:
    needs: release-package-windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: bpa-windows-x64-rc-builder-*
          path: ${{ runner.temp }}/builders
      - name: Compare independent Builder closures
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem `
            -LiteralPath (Join-Path $env:RUNNER_TEMP "builders") `
            -Filter "bpa-local-*-windows-x64.zip" `
            -File `
            -Recurse)
          if ($archives.Count -ne 2) {
            throw "Expected exactly two independent Builder archives"
          }
          ./scripts/compare-windows-runtime-archives.ps1 `
            -FirstArchive $archives[0].FullName `
            -SecondArchive $archives[1].FullName
          $canonical = Join-Path $env:RUNNER_TEMP "canonical"
          New-Item -ItemType Directory -Path $canonical -Force | Out-Null
          Copy-Item -LiteralPath $archives[0].FullName -Destination $canonical
          Copy-Item -LiteralPath "$($archives[0].FullName).sha256" -Destination $canonical
      - name: Upload cross-Builder verified Runtime
        uses: actions/upload-artifact@v6
        with:
          name: bpa-windows-x64-rc
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/canonical/bpa-local-*-windows-x64.zip
            ${{ runner.temp }}/canonical/bpa-local-*-windows-x64.zip.sha256

  release-workbuddy-skill:
    needs: verify-windows-reproducibility
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v6
        with:
          name: bpa-windows-x64-rc
          path: ${{ runner.temp }}/windows-runtime
      - name: Assemble and verify complete WorkBuddy Skill
        run: |
          runtime="$(find "$RUNNER_TEMP/windows-runtime" -name 'bpa-local-*-windows-x64.zip' -type f -print -quit)"
          test -n "$runtime"
          output="$RUNNER_TEMP/doudian-alliance-retired-monitor.skill.zip"
          node scripts/package-doudian-alliance-skill.mjs \
            --runtime "$runtime" \
            --output "$output"
          node scripts/verify-doudian-alliance-skill.mjs "$output"
      - name: Upload verified WorkBuddy delivery
        uses: actions/upload-artifact@v6
        with:
          name: doudian-alliance-retired-monitor-skill-rc
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/doudian-alliance-retired-monitor.skill.zip
            ${{ runner.temp }}/doudian-alliance-retired-monitor.skill.zip.sha256
